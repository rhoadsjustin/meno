# Subflow: walk the 4-step onboarding on a fresh install and land on the
# empty Today tab. Assumes the app was just launched with clearState.
appId: com.rhoadsdev.meno
---
# Cold start renders nothing until SQLite migrations finish, then Today's
# focus effect redirects to onboarding — wait generously.
- extendedWaitUntil:
    visible: "Let the Word remain in you\\."
    timeout: 30000
- tapOn: "Continue"
# Notifications step — decline so no OS permission dialog appears.
- tapOn: "Later"
# Widget step. Its captures push the button below the fold on short screens
# (the iPhone Duo's cover panel), so scroll to it rather than assume it shows.
- scrollUntilVisible:
    element: "Continue"
    direction: DOWN
- tapOn: "Continue"
# Lock step — skip the quick start ("Try it with John 3:16") and the passage
# picker, straight to Today.
- scrollUntilVisible:
    element: "Explore first"
    direction: DOWN
- tapOn: "Explore first"
- extendedWaitUntil:
    visible: "Nothing memorized yet"
    timeout: 10000
