# Goal wizard happy path with defaults → Today shows the practice card.
appId: com.rhoadsdev.meno
tags:
  - smoke
---
- launchApp:
    clearState: true
- runFlow: ../helpers/complete-onboarding.yml
- runFlow: ../helpers/create-goal.yml
# Attribution line reads "<range> · <ABBREV>", e.g. "John 1:1 · WEB".
- assertVisible: "John 1:1.*"
# The practice button says what it will do: a fresh verse starts.
- assertVisible: "Start John 1:1.*"
