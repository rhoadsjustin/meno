# Fresh install → onboarding → empty Today tab.
appId: com.rhoadsdev.meno
tags:
  - smoke
---
- launchApp:
    clearState: true
- runFlow: ../helpers/complete-onboarding.yml
# The empty state offers starter verses (John 3:16 first) as swipeable cards.
# Their text loads a beat after the screen, and its translation depends on
# the build (ESV with a key and network, bundled KJV otherwise), so assert
# the reference and the action — never the verse text.
- extendedWaitUntil:
    visible: "John 3:16"
    timeout: 15000
- assertVisible: "Practice John 3:16"
# The cards can push the quieter link below the fold on short screens.
- scrollUntilVisible:
    element: "Choose my own passage"
    direction: DOWN
