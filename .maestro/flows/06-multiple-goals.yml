# Two passages in progress → Today lists the second under "Also practicing",
# and "Make this my focus" swaps which one is the focus (the widget verse).
# The wizard's native menus aren't Maestro-friendly, so both goals use the
# wizard defaults (John 1:1); the flow checks structure, not titles.
appId: com.rhoadsdev.meno
tags:
  - smoke
---
- launchApp:
    clearState: true
- runFlow: ../helpers/complete-onboarding.yml
- runFlow: ../helpers/create-goal.yml
- tapOn: "Add passage"
- extendedWaitUntil:
    visible: "Choose a passage"
    timeout: 10000
- tapOn: "Continue"
- assertVisible: "Your plan"
- tapOn: "Start memorizing"
- extendedWaitUntil:
    visible: "Also practicing"
    timeout: 10000
- assertVisible: "Your focus"
- scrollUntilVisible:
    element: "Make John 1:1 your focus.*"
    direction: DOWN
- tapOn: "Make John 1:1 your focus.*"
# The other passage is now the focus; the first moves under "Also practicing".
- assertVisible: "Also practicing"
- scrollUntilVisible:
    element: "Your focus"
    direction: UP
- tapOn: "Library"
# Library marks the focus passage and offers the switch in the other one's
# More menu. The oldest passage is listed first and is no longer the focus,
# so the first More button is its.
- scrollUntilVisible:
    element: "Your focus"
    direction: DOWN
- tapOn: "More actions for John 1:1"
- assertVisible: "Make this my focus"
