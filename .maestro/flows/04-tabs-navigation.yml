# Walk all four tabs and check each screen's key content.
appId: com.rhoadsdev.meno
tags:
  - smoke
---
- launchApp:
    clearState: true
- runFlow: ../helpers/complete-onboarding.yml
- tapOn: "Library"
- assertVisible: "In progress"
- assertVisible: "No goals yet"
- tapOn: "Stats"
- assertVisible: ".*day streak.*"
- assertVisible: "Badges"
- tapOn: "Settings"
- assertVisible: "Review reminders"
# The row merges title + subtitle into one accessibility element.
- assertVisible: ".*Recite to Unlock.*"
# Setup guide opens as a sheet and closes back to Settings.
- tapOn: ".*How to set up Meno.*"
# The guide presents as a sheet — assert through the presentation animation,
# or the first row is checked before it has rendered (this flaked on CI and
# was only caught because the runner's retry happened to pass).
# Overview rows merge the feature name with its status.
- extendedWaitUntil:
    visible: ".*Surprise quizzes.*"
    timeout: 10000
- assertVisible: ".*Home Screen widget.*"
- tapOn: "Done"
# Dismissal animates too.
- extendedWaitUntil:
    visible: "Review reminders"
    timeout: 10000
- tapOn: "Today"
- assertVisible: "Start a goal"
