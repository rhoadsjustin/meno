name: E2E (Maestro)

# Runs after each PR merges to main. Fast checks (typecheck/lint/unit tests)
# live in ci.yml; this workflow builds the app for the iOS simulator and runs
# the Maestro flows in .maestro/flows against it. macOS runners are free for
# public repos.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ship:
        description: 'Also build and submit to TestFlight after the suite passes'
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # CocoaPods 1.17 fails on ASCII-8BIT locales during pod install.
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:bible

      - name: Select Xcode 26
        # The image default is Xcode 16; the project needs the iOS 26 SDK.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Prebuild iOS project
        # ios/ is gitignored (CNG) — always a fresh prebuild, pods included.
        run: npx expo prebuild --platform ios

      - name: Build app for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Meno.xcworkspace \
            -scheme Meno \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build | (command -v xcbeautify >/dev/null && xcbeautify --quiet || cat)

      - name: Boot simulator and install app
        # Individual runner simulators wedge on boot (observed twice on the
        # same device model on fresh VMs), and `simctl boot`/`bootstatus` can
        # block forever on one. Boot in the background, poll for Booted with a
        # bounded wait, and fall through to the next candidate device.
        timeout-minutes: 12
        run: |
          # Pin to iOS 26 runtimes: they match the SDK the app is built
          # with, and on iOS 18.x Maestro cannot dismiss the deep-link
          # "Open in Meno?" dialog, which then blocks later flows.
          CANDIDATES=$(xcrun simctl list devices available --json \
            | jq -r '.devices | to_entries[] | select(.key | contains("iOS-26")) | .value[] | select(.name | test("^iPhone")) | .udid')
          test -n "$CANDIDATES"
          UDID=""
          for udid in $CANDIDATES; do
            echo "Trying simulator $udid"
            (xcrun simctl boot "$udid" || true) &
            for _ in $(seq 1 36); do  # up to 3 minutes per candidate
              state=$(xcrun simctl list devices --json \
                | jq -r --arg u "$udid" '.devices[][] | select(.udid == $u) | .state')
              if [ "$state" = "Booted" ]; then UDID="$udid"; break; fi
              sleep 5
            done
            if [ -n "$UDID" ]; then break; fi
            echo "Simulator $udid did not boot; trying next candidate"
            xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true
          done
          test -n "$UDID"
          echo "Using simulator $UDID"
          sleep 15  # let springboard settle before install
          xcrun simctl install "$UDID" ios/build/Build/Products/Release-iphonesimulator/Meno.app
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows
        timeout-minutes: 30
        env:
          # CI simulators start the XCTest driver slowly; the default timeout
          # aborts with IOSDriverTimeoutException before the first flow runs.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
        # One retry: shared CI simulators occasionally drop or crash the app
        # mid-flow; a legitimate regression fails both attempts.
        run: |
          maestro --udid "$UDID" test --format junit --output maestro-report.xml .maestro/flows \
            || { echo "::warning::Maestro suite failed once; retrying"; \
                 maestro --udid "$UDID" test --format junit --output maestro-report.xml .maestro/flows; }

      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts
          path: |
            maestro-report.xml
            ~/.maestro/tests
            ~/Library/Logs/DiagnosticReports
          if-no-files-found: ignore

  # After the suite passes on a merge, trigger an EAS production build that
  # auto-submits to TestFlight. --no-wait: this job only kicks it off — the
  # build and submission run on EAS (watch at expo.dev), and each merge
  # consumes one iOS build from the EAS plan's quota.
  testflight:
    name: Build and submit to TestFlight
    needs: [maestro-ios]
    # Gated so routine merges don't each consume an EAS build: ship by
    # putting "[ship]" in the merge commit message, or by running the
    # workflow manually with the ship checkbox ticked.
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[ship]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.ship)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Trigger EAS build and submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create an access token at https://expo.dev/accounts/rhoadsjustin/settings/access-tokens and add it with: gh secret set EXPO_TOKEN"
            exit 1
          fi
          npx eas-cli@latest build -p ios --profile production --submit --non-interactive --no-wait
